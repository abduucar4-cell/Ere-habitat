<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulaires</title></head>
<body>
<!-- Déclaration du formulaire pour Netlify Forms (détection au déploiement). Ne pas supprimer. -->
<form name="devis" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="devis">
  <input name="bot-field">
  <input name="type_formulaire">
  <input name="nom">
  <input name="telephone">
  <input name="email">
  <input name="commune">
  <input name="code_postal">
  <input name="logement">
  <input name="deja_equipe">
  <input name="consommation">
  <input name="projet">
  <input name="budget">
  <input name="delai">
  <textarea name="message"></textarea>
  <input name="accepte_informations">
  <textarea name="simulateur"></textarea>
  <input name="page">
</form>
</body>
</html>
