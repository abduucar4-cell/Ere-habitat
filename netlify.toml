# Configuration Netlify — Next.js (le runtime Next.js de Netlify s'applique automatiquement)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Module officiel Next.js de Netlify (rendu serveur, routes API, images)
[[plugins]]
  package = "@netlify/plugin-nextjs"
